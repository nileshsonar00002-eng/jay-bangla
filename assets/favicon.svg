<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1f1810"/>
      <stop offset="65%" stop-color="#120e09"/>
      <stop offset="100%" stop-color="#080604"/>
    </radialGradient>

    <!-- Golden Rim Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="30%" stop-color="#FFB300"/>
      <stop offset="70%" stop-color="#FF8F00"/>
      <stop offset="100%" stop-color="#FFE082"/>
    </linearGradient>

    <!-- Saffron / Orange Pheta Gradients -->
    <linearGradient id="phetaBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9100"/>
      <stop offset="45%" stop-color="#FF6D00"/>
      <stop offset="100%" stop-color="#DD2C00"/>
    </linearGradient>

    <linearGradient id="phetaHighlight" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFA726"/>
      <stop offset="50%" stop-color="#FF7043"/>
      <stop offset="100%" stop-color="#E64A19"/>
    </linearGradient>

    <linearGradient id="phetaFoldDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6D00"/>
      <stop offset="100%" stop-color="#BF360C"/>
    </linearGradient>

    <!-- Turra Fan Pleat Gradient -->
    <linearGradient id="turraGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E65100"/>
      <stop offset="40%" stop-color="#FF6D00"/>
      <stop offset="85%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#FFD54F"/>
    </linearGradient>

    <!-- Golden Zari Lace Gradient -->
    <linearGradient id="zariLace" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE57F"/>
      <stop offset="50%" stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>

    <!-- Kalgi Jewel Gradient -->
    <radialGradient id="rubyJewel" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="60%" stop-color="#D50000"/>
      <stop offset="100%" stop-color="#880E4F"/>
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="phetaShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#FF6D00" flood-opacity="0.25"/>
    </filter>

    <filter id="kalgiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Dark Circular Background Container -->
  <circle cx="256" cy="256" r="244" fill="url(#bgGrad)"/>
  
  <!-- Subtle Golden Border Ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#goldRim)" stroke-width="4.5" opacity="0.65"/>
  <circle cx="256" cy="256" r="232" fill="none" stroke="#FF8F00" stroke-width="1.2" opacity="0.25"/>

  <!-- Main Pheta Emblem Group -->
  <g filter="url(#phetaShadow)">
    
    <!-- 1. Pheta Tail / Shempla (Draped Silk on Right) -->
    <path d="M 320 280 Q 375 320 380 405 Q 365 418 340 408 Q 330 350 300 310 Z" 
          fill="url(#phetaFoldDark)"/>
    <path d="M 330 290 Q 380 330 385 403 Q 375 412 355 408 Q 345 355 315 315 Z" 
          fill="url(#phetaBase)"/>
    <!-- Golden Border on Tail -->
    <path d="M 380 395 Q 385 405 380 412 Q 360 416 342 408" 
          fill="none" stroke="url(#zariLace)" stroke-width="6" stroke-linecap="round"/>

    <!-- 2. Turra (The Royal Fan Pleats at Top) -->
    <!-- Fan Pleat 1 (Leftmost) -->
    <path d="M 235 210 Q 185 160 170 115 Q 192 110 215 130 Q 235 165 245 210 Z" 
          fill="url(#turraGrad)"/>
    <path d="M 170 115 Q 192 110 215 130" 
          fill="none" stroke="url(#zariLace)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Fan Pleat 2 -->
    <path d="M 240 205 Q 210 135 212 90 Q 235 88 252 115 Q 256 160 252 205 Z" 
          fill="url(#turraGrad)"/>
    <path d="M 212 90 Q 235 88 252 115" 
          fill="none" stroke="url(#zariLace)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Fan Pleat 3 (Center High Crown) -->
    <path d="M 248 200 Q 248 115 258 70 Q 282 72 292 105 Q 285 155 268 200 Z" 
          fill="url(#turraGrad)"/>
    <path d="M 258 70 Q 282 72 292 105" 
          fill="none" stroke="url(#zariLace)" stroke-width="5" stroke-linecap="round"/>

    <!-- Fan Pleat 4 -->
    <path d="M 258 205 Q 285 125 308 85 Q 328 92 330 125 Q 310 165 282 205 Z" 
          fill="url(#turraGrad)"/>
    <path d="M 308 85 Q 328 92 330 125" 
          fill="none" stroke="url(#zariLace)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Fan Pleat 5 (Rightmost) -->
    <path d="M 268 210 Q 315 145 348 112 Q 365 125 358 152 Q 330 185 292 212 Z" 
          fill="url(#turraGrad)"/>
    <path d="M 348 112 Q 365 125 358 152" 
          fill="none" stroke="url(#zariLace)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- 3. Turban Main Body / Dynamic Khandeshi Pagdi Wraps -->
    <!-- Base Dome / Head Mold -->
    <path d="M 125 295 Q 110 240 170 205 Q 256 175 345 205 Q 405 240 385 295 Q 360 365 256 370 Q 150 365 125 295 Z" 
          fill="url(#phetaFoldDark)"/>

    <!-- Layer Fold 1 (Back Wrap) -->
    <path d="M 130 280 C 135 220 230 185 320 200 C 375 212 390 255 375 290 C 330 250 200 240 130 280 Z" 
          fill="url(#phetaBase)"/>

    <!-- Layer Fold 2 (Main Upper Contour) -->
    <path d="M 115 295 C 130 235 240 205 340 220 C 395 230 405 285 375 315 C 300 265 180 260 115 295 Z" 
          fill="url(#phetaHighlight)"/>
    <!-- Golden Zari Piping along Upper Fold -->
    <path d="M 130 270 Q 235 218 348 230 Q 388 245 385 280" 
          fill="none" stroke="url(#zariLace)" stroke-width="4" opacity="0.85"/>

    <!-- Layer Fold 3 (Mid Wrap - Cross Pleat) -->
    <path d="M 110 308 C 135 270 250 245 355 260 C 395 275 390 325 350 345 C 270 300 170 295 110 308 Z" 
          fill="url(#phetaBase)"/>

    <!-- Layer Fold 4 (Front Forehead Cross Wrap) -->
    <path d="M 118 318 C 155 290 265 270 365 285 C 385 310 375 345 330 360 C 240 325 155 320 118 318 Z" 
          fill="url(#phetaHighlight)"/>
    <!-- Golden Zari Ribbon on Front Wrap -->
    <path d="M 122 318 Q 235 282 355 296" 
          fill="none" stroke="url(#zariLace)" stroke-width="4.5"/>

    <!-- Layer Fold 5 (Lower Rim / Headband) -->
    <path d="M 132 330 C 180 312 280 302 360 318 C 362 342 335 365 256 368 C 180 365 140 348 132 330 Z" 
          fill="url(#phetaFoldDark)"/>
    <path d="M 140 334 C 185 318 275 310 350 324 C 342 348 310 364 256 366 C 195 364 152 348 140 334 Z" 
          fill="url(#phetaBase)"/>

    <!-- Bottom Golden Zari Lace Band -->
    <path d="M 148 340 Q 256 325 342 335" 
          fill="none" stroke="url(#zariLace)" stroke-width="5.5" stroke-linecap="round"/>

    <!-- 4. Royal Shirpech / Kalgi Brooch (Center Jewel Ornament) -->
    <g filter="url(#kalgiGlow)">
      <!-- Golden Plume Holder Feather/Spire -->
      <path d="M 238 215 Q 232 175 228 150 Q 236 155 244 212 Z" 
            fill="url(#zariLace)"/>
      <path d="M 238 215 Q 244 165 250 142 Q 252 165 246 215 Z" 
            fill="url(#zariLace)"/>

      <!-- Golden Brooch Base Diamond -->
      <polygon points="244,195 257,208 244,222 231,208" fill="url(#zariLace)"/>
      <circle cx="244" cy="208" r="9" fill="#FFD54F"/>
      
      <!-- Center Glowing Ruby Gem -->
      <circle cx="244" cy="208" r="6.5" fill="url(#rubyJewel)"/>
      <circle cx="242" cy="206" r="2" fill="#FFFFFF" opacity="0.8"/>

      <!-- Hanging Pearl Teardrop -->
      <path d="M 244 223 Q 248 231 244 236 Q 240 231 244 223 Z" fill="#FFF8E1"/>
      <circle cx="244" cy="233" r="2.5" fill="#FFE082"/>
    </g>

    <!-- Top Volumetric Highlight (Soft 3D Sheen) -->
    <ellipse cx="250" cy="245" rx="75" ry="18" 
             fill="#FFFFFF" opacity="0.12" transform="rotate(-8 250 245)"/>
  </g>
</svg>
