<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Rich Goldsmith Metallic Gold Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="30%" stop-color="#D4A359"/>
      <stop offset="70%" stop-color="#9E6F24"/>
      <stop offset="100%" stop-color="#F3C878"/>
    </linearGradient>

    <!-- Gold Center Label Gradient -->
    <radialGradient id="goldLabel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#54360F"/>
      <stop offset="65%" stop-color="#9E6F24"/>
      <stop offset="90%" stop-color="#D4A359"/>
      <stop offset="100%" stop-color="#FFF3C4"/>
    </radialGradient>

    <!-- Vinyl Sheen Highlight -->
    <linearGradient id="vinylSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.15)"/>
      <stop offset="40%" stop-color="rgba(255, 255, 255, 0)"/>
      <stop offset="60%" stop-color="rgba(255, 255, 255, 0.2)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.1)"/>
    </linearGradient>
  </defs>

  <!-- 1. Outer Dark Drop Contour for Light Tab Contrast -->
  <circle cx="32" cy="32" r="31.5" fill="#000000" opacity="0.4"/>

  <!-- 2. Main Black Vinyl Disc with Rich Goldsmith Metallic Border (#D4A359) -->
  <circle cx="32" cy="32" r="30" fill="#0c0c0e" stroke="url(#goldBorder)" stroke-width="2.5"/>

  <!-- 3. Concentric Sound Grooves -->
  <circle cx="32" cy="32" r="25.5" fill="none" stroke="#25252c" stroke-width="0.8"/>
  <circle cx="32" cy="32" r="22.5" fill="none" stroke="#363640" stroke-width="0.6"/>
  <circle cx="32" cy="32" r="19.5" fill="none" stroke="#222228" stroke-width="0.8"/>
  <circle cx="32" cy="32" r="16.5" fill="none" stroke="#2e2e38" stroke-width="0.6"/>

  <!-- 4. Vinyl Light Sheen -->
  <circle cx="32" cy="32" r="28.5" fill="url(#vinylSheen)" pointer-events="none"/>

  <!-- 5. Center Golden Record Label -->
  <circle cx="32" cy="32" r="11" fill="url(#goldLabel)" stroke="#1a0f05" stroke-width="0.8"/>
  <circle cx="32" cy="32" r="8.5" fill="none" stroke="#FFF3C4" stroke-width="0.5" opacity="0.8"/>

  <!-- 6. Distinct Central Spindle Hole with High-Contrast Gold/Metallic Rim -->
  <circle cx="32" cy="32" r="4" fill="#000000" stroke="#D4A359" stroke-width="1.2"/>
  <circle cx="32" cy="32" r="2.2" fill="#000000"/>
</svg>